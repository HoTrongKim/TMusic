name: tmusic
description: Thư viện liên kết âm nhạc cá nhân TMusic.
publish_to: none
version: 2.0.0+1
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
