name: TMusic V2
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: tmusic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Start isolated SQL Server
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 24)Az!5"
          echo "::add-mask::$password"
          docker run -d --name tmusic-v2-test-sql -p 127.0.0.1:1433:1433 \
            -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$password" mcr.microsoft.com/mssql/server:2022-latest
          for attempt in $(seq 1 40); do
            if docker exec -e SQLCMDPASSWORD="$password" tmusic-v2-test-sql \
              /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -l 3 -Q 'SELECT 1' >/dev/null 2>&1; then
              echo "TMUSIC_SQL_TEST_SERVER=Server=127.0.0.1,1433;User ID=sa;Password=$password;Encrypt=True;TrustServerCertificate=True" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 3
          done
          exit 1
      - run: dotnet restore backend/TMusic.slnx -p:NuGetAuditMode=all -warnaserror:NU1901,NU1902,NU1903,NU1904
      - run: dotnet build backend/TMusic.slnx -c Release --no-restore
      - run: dotnet test backend/TMusic.slnx -c Release --no-build --logger trx
      - name: Stop test SQL
        if: always()
        run: docker rm -f tmusic-v2-test-sql
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: flutter build apk --debug --no-pub
