name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Địa chỉ HTTPS của API TMusic'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Cài dependencies
        run: flutter pub get --enforce-lockfile

      - name: Kiểm tra mã nguồn
        run: flutter analyze --no-pub

      - name: Chạy kiểm thử
        run: |
          flutter test --no-pub
          python3 -m unittest discover -s ../scripts/tests -p test_prepare_mobile_oauth.py -v

      - name: Build iOS
        env:
          TMUSIC_BUILD_API_URL: ${{ inputs.api_url }}
          TMUSIC_GOOGLE_SERVER_CLIENT_ID: ${{ secrets.TMUSIC_GOOGLE_SERVER_CLIENT_ID }}
          TMUSIC_GOOGLE_IOS_CLIENT_ID: ${{ secrets.TMUSIC_GOOGLE_IOS_CLIENT_ID }}
        run: |
          set -euo pipefail
          python3 ../scripts/prepare_mobile_oauth.py \
            --platform ios \
            --output "$RUNNER_TEMP/tmusic-ios-public-defines.json" \
            --info-plist ios/Runner/Info.plist
          flutter build ios --release --no-codesign --no-pub \
            --build-number "$GITHUB_RUN_NUMBER" \
            --dart-define-from-file="$RUNNER_TEMP/tmusic-ios-public-defines.json"

      - name: Kiểm tra khởi động iOS Simulator
        env:
          TMUSIC_BUILD_API_URL: ${{ inputs.api_url }}
          TMUSIC_GOOGLE_SERVER_CLIENT_ID: ${{ secrets.TMUSIC_GOOGLE_SERVER_CLIENT_ID }}
          TMUSIC_GOOGLE_IOS_CLIENT_ID: ${{ secrets.TMUSIC_GOOGLE_IOS_CLIENT_ID }}
        run: |
          set -euo pipefail
          flutter build ios --simulator --debug --no-codesign --no-pub \
            --build-number "$GITHUB_RUN_NUMBER" \
            --dart-define-from-file="$RUNNER_TEMP/tmusic-ios-public-defines.json"
          device="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(device["udid"] for devices in data["devices"].values() for device in devices if device["isAvailable"] and device["name"].startswith("iPhone")))')"
          xcrun simctl boot "$device" 2>/dev/null || true
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" build/ios/iphonesimulator/Runner.app
          xcrun simctl launch "$device" com.tmusic.tmusic
          sleep 8
          xcrun simctl listapps "$device" | grep -F 'com.tmusic.tmusic'
          xcrun simctl spawn "$device" launchctl list | grep -F 'com.tmusic.tmusic'

      - name: Đóng gói IPA
        run: |
          set -euo pipefail
          mkdir -p dist build/ios/iphoneos/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -qry ../../../dist/TMusic-unsigned.ipa Payload

      - name: Đăng tải IPA
        uses: actions/upload-artifact@v4
        with:
          name: TMusic-unsigned-IPA
          path: mobile/dist/TMusic-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
